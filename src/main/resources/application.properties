spring.application.name=lostandfound

spring.datasource.url=jdbc:mysql://localhost:3306/lost_and_found_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:thaiyuth01}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB

# TU login. While there is no real app key, keep dev-mode=true (any @dome.tu.ac.th email can log in).
# Must be false when submitting the project.
tu.api.app-key=${TU_APP_KEY:}
tu.api.dev-mode=true
jwt.secret=${JWT_SECRET:}
spring.jackson.mapper.accept-case-insensitive-enums=true