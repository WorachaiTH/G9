<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lost and Found</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Itim&display=swap" rel="stylesheet">
</head>

<body>

  <nav id="app-nav" class="navbar" hidden>
    <div class="nav-container">
      <div class="nav-brand">
        <img class="nav-logo" src="./image/logo.PNG" alt="Lost and Found">
        <span>Lost & Found</span>
      </div>
      <div class="nav-menu">
        <button type="button" class="nav-link active" id="navHome">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5a.5.5 0 0 0 .5.5h4v-5.5h4V20h4a.5.5 0 0 0 .5-.5V10"/></svg>
  หน้าหลัก
</button>
        <button type="button" class="nav-link" id="navAdd">＋ เพิ่มโพสต์</button>
      </div>
      <div class="nav-user">
        <span id="who" class="user-email"></span>
        <button id="logout" class="logout-btn" type="button">ออกจากระบบ</button>
      </div>
    </div>
  </nav>

  <div class="wrap">

    <div id="login" class="lg">
      <div class="lg-form">
        <img class="lg-banner" src="./image/logo.PNG" alt="Lost and Found">
        <div class="toast" id="lgmsg" hidden></div>
        <label for="employeeId">รหัสประจำตัวบุคลากร</label>
        <div class="fld"><svg viewBox="0 0 24 24">
            <rect x="3" y="5" width="18" height="14" rx="3" />
            <circle cx="9" cy="11" r="2" />
            <path d="M6 16c.8-2 5.2-2 6 0M14 10h4M14 14h4" />
          </svg><input id="employeeId" type="text" inputmode="numeric" autocomplete="username"
            placeholder="กรอกรหัสประจำตัวบุคลากร"></div>
        <div class="err" id="eEmployeeId"></div>
        <div class="row"><label for="pw">รหัสผ่าน (ใช้ภาษาอังกฤษและตัวเลขเท่านั้น)</label><a href="#"
            id="forgot">ลืมรหัสผ่าน?</a></div>
        <div class="fld">
          <input id="pw" type="password" autocomplete="current-password" placeholder="••••••••">
          <button type="button" id="eye" aria-label="แสดงรหัสผ่าน">
            <svg viewBox="0 0 24 24">
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
        </div>
        <div class="err" id="ePw"></div>
        <button class="btn" id="loginBtn" type="button">เข้าสู่ระบบ</button>
        <div class="hint" style="text-align:center;margin-top:14px">กรอกรหัสประจำตัวบุคลากรเป็นตัวเลข</div>
      </div>
    </div>

    <div id="home" data-tab="lost" hidden>
      <div class="headbox">
        <h1>ศูนย์ของหาย–ของเจอ</h1>
        <p class="sub">ดูรายการแจ้งของหายและของที่มีคนเจอ หรือเพิ่มโพสต์ของคุณ</p>
        <div class="toast" id="toast" hidden>โพสต์ของคุณถูกเพิ่มแล้ว</div>
        <div class="seg tabs"><button id="tL" class="on l" type="button">ของหาย</button><button id="tF"
            type="button">เจอของ</button></div>
        <div id="cols">
          <div class="col l">
            <div class="colh">แจ้งของหาย <span class="cnt" id="nL"></span></div>
            <div id="feedL"></div>
          </div>
          <div class="col f">
            <div class="colh">เจอของหาย <span class="cnt" id="nF"></span></div>
            <div id="feedF"></div>
          </div>
        </div>
      </div>
    </div>

    <div id="form" hidden>
      <div class="headbox">
        <div class="top"><button class="back" id="back" type="button" aria-label="กลับ">←</button>
          <h1>เพิ่มโพสต์</h1>
        </div>
        <p class="sub" id="fsub"></p>

        <div class="seg"><button id="sL" type="button">ฉันทำของหาย</button><button id="sF"
            type="button">ฉันเจอของ</button></div>

        <div class="card c1">
          <h2><span class="n">1</span>รูปภาพ <span class="hint" id="opt"></span></h2>
          <div class="drop" id="drop" tabindex="0">
            <div style="font-size:2rem">📷</div><b>แตะเพื่อถ่ายรูปหรือเลือกรูป</b><span>JPG, PNG ไม่เกิน 5 MB</span>
          </div>
          <div class="prev" id="prev" hidden><img id="img" alt="รูปสิ่งของ"><button type="button"
              id="rm">เปลี่ยนรูป</button></div>
          <input type="file" id="file" accept="image/*" hidden>
          <div class="err" id="eImg"></div>
        </div>

        <div class="card c2">
          <h2><span class="n">2</span>รายละเอียด / สถานที่</h2>
          <label for="desc">รายละเอียดของสิ่งของ</label>
          <textarea id="desc" placeholder="เช่น กระเป๋าสตางค์สีน้ำตาล มีบัตรนักศึกษา 1 ใบ"></textarea>
          <div class="err" id="eDesc"></div>
          <label for="loc" id="locL"></label>
          <input id="loc" placeholder="เช่น โรงอาหารsc, ตึกsc1 ห้อง1001">
          <div class="err" id="eLoc"></div>
        </div>

        <div class="card c3">
          <h2><span class="n">3</span>ติดต่อผู้แจ้ง</h2>
          <label for="name">ชื่อ</label>
          <input id="name" placeholder="ชื่อ-นามสกุล หรือชื่อเล่น">
          <div class="err" id="eName"></div>
          <label for="tel">เบอร์โทร / LINE ID / อีเมล</label>
          <input id="tel" placeholder="เช่น 08x-xxx-xxxx หรือ lineid">
          <div class="err" id="eTel"></div>
        </div>
      </div>
      <button class="btn" id="post" type="button">โพสต์</button>
    </div>

  </div>
  <script src="script.js"></script>
</body>

</html>
